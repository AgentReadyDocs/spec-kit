[package]
name = "ard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "AgentReadyDocs CLI: lint agent-ready docs, install skills, and access templates/rubrics."

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
include_dir = "0.7.4"
regex = "1.11.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.12.0"
