name: release-ard

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ard
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: ard
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ard.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build -p ard --release --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          tar -czf "ard-${{ matrix.target }}.tar.gz" -C dist "${{ matrix.bin }}"
          shasum -a 256 "ard-${{ matrix.target }}.tar.gz" | awk '{print $1 "  " $2}' > "ard-${{ matrix.target }}.sha256"
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          Compress-Archive -Path "dist/${{ matrix.bin }}" -DestinationPath "ard-${{ matrix.target }}.zip" -Force
          $hash = (Get-FileHash "ard-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ard-${{ matrix.target }}.zip" | Out-File -Encoding ascii "ard-${{ matrix.target }}.sha256"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ard-${{ matrix.target }}.${{ matrix.archive }}
            ard-${{ matrix.target }}.sha256
